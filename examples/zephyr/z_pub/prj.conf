## Minimal rmw_zenoh_pico-based publisher configuration (ESP32, Zephyr 4.2.x)

# Libc and POSIX features
CONFIG_POSIX_API=y
# Uncomment one libc if needed
# CONFIG_MINIMAL_LIBC=y
# CONFIG_NEWLIB_LIBC=y

# Logging and console
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Hardware
CONFIG_SERIAL=y
CONFIG_GPIO=y

# Networking core
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y

# Network management (required for WiFi)
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_WIFI_MGMT=y

# Enable modules
CONFIG_ZENOH_PICO=y
CONFIG_RMW_ZENOH_PICO=y

# Zenoh mode: peer (multicast discovery) or client (connect to router)
# Comment out for peer mode, uncomment for client mode
# CONFIG_ZENOH_PICO_CLIENT_MODE=y

# Disable heavier subsystems
CONFIG_SHELL=n
CONFIG_PM=n
CONFIG_SMP=n

# Stack and heap
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=46384
