# Native simulation configuration for Zenoh-pico publisher
# Uses offloaded sockets (NSOS - Native Simulator Offloaded Sockets)
# This allows the app to use the host's network stack directly via localhost

# Disable TAP interface (prevents "Cannot create zeth" error)
CONFIG_ETH_NATIVE_TAP=n

# Enable offloaded sockets for native_sim (uses host BSD sockets)
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# Disable WiFi
CONFIG_WIFI=n
