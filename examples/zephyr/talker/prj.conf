## RMW Zenoh-pico Zephyr Talker Example Configuration

# Libc and POSIX features
CONFIG_POSIX_API=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n

# Logging and console
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Hardware
CONFIG_SERIAL=y
CONFIG_GPIO=y

# Networking core
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y

# Network management (required for WiFi)
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_WIFI_MGMT=y

# Enable Zenoh-pico and RMW Zenoh-pico modules
CONFIG_ZENOH_PICO=y
CONFIG_RMW_ZENOH_PICO=y

# Zenoh mode: client (connect to router)
# CONFIG_ZENOH_PICO_CLIENT_MODE=y is set in board overlay for ESP32

# Disable heavier subsystems
CONFIG_SHELL=n
CONFIG_PM=n
CONFIG_SMP=n

# Stack and heap (increased for RCL/RCLC)
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=98304

# Thread options
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=4096

# Enable dynamic memory features for RCL
CONFIG_DYNAMIC_THREAD=y
